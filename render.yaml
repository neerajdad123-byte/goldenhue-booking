# One-click hosting on Render, from this repository.
#
# Render builds nothing (there are no dependencies) and runs the same command you
# run locally. The disk is the important line: it is what makes the bookings
# survive a restart or a redeploy.
#
# ponytail: a disk needs a paid instance type. On the free tier drop the disk
# block and accept that the database resets on every deploy, which is fine for a
# demo and not fine for a salon.
services:
  - type: web
    name: goldenhue-booking
    runtime: node
    plan: starter
    buildCommand: ""
    startCommand: node outputs/demo/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DB_FILE
        value: /var/goldenhue/goldenhue.db
      - key: PORT
        value: "10000"
    disk:
      name: goldenhue-data
      mountPath: /var/goldenhue
      sizeGB: 1
