# One-click deploy:
#   https://render.com/deploy?repo=https://github.com/neerajdad123-byte/goldenhue-booking
#
# Deliberately free. Render's free web services have no disk, so the database
# cannot live on the host: it lives in a free managed Postgres instead, and this
# service holds the credentials. Nothing here needs a payment method.
#
# DATABASE_URL is asked for during the deploy. Neon's free tier states plainly
# that it needs no credit card: https://neon.com/pricing
services:
  - type: web
    name: goldenhue-booking
    runtime: node
    plan: free
    rootDir: outputs/demo
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Where the bookings live. Without it the app falls back to a local SQLite
      # file, which the free tier would lose on every restart.
      - key: DATABASE_URL
        sync: false
      # Render serves over https, so the session cookie can be Secure.
      - key: COOKIE_SECURE
        value: "1"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
